<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Fiama</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body data-page="product-details" class="bg-white text-[#666666] antialiased selection:bg-[#E55472] selection:text-white min-h-screen flex flex-col">
    <div id="site-header"></div>

    <main class="flex-1">
      <section class="bg-[#F2F2F2] py-12 md:py-16">
        <div class="mx-auto max-w-[1170px] px-[15px] text-center">
          <h1 class="text-[28px] md:text-[34px] font-bold text-[#010101]">Products</h1>
          <div class="mt-2 flex items-center justify-center gap-2 text-[13px] font-medium">
            <a href="/index.html" class="text-[#666666] hover:text-[#E55472] transition-colors">Home</a>
            <span class="text-[#999999]">&gt;</span>
            <span class="text-[#010101]">Products</span>
          </div>
        </div>
      </section>

      <section class="mx-auto max-w-[1170px] px-[15px] pt-16 pb-14">
        <div id="pdp-top-container" class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start"></div>
      </section>

      <section class="mx-auto max-w-[1170px] px-[15px] pb-16">
        <div id="pdp-tabs-container" class="border-t border-[#EDEDED] pt-10"></div>
      </section>

      <section class="mx-auto max-w-[1170px] px-[15px] pb-20">
        <div class="mb-10 text-center">
          <h2 class="text-[28px] md:text-[32px] font-bold lowercase text-[#010101]">related products</h2>
          <div class="mx-auto mt-3 h-[2px] w-14 bg-[#E55472]/50"></div>
        </div>
        <div id="pdp-related-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
      </section>
    </main>

    <section id="brand-logos"></section>
    <div id="site-footer"></div>
    <div id="site-modals"></div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
