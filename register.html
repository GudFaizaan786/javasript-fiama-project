<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Fiama</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body data-page="register" class="bg-white text-[#666666] antialiased selection:bg-[#E55472] selection:text-white min-h-screen flex flex-col">
    <div id="site-header"></div>

    <main class="flex-1">
      <section class="bg-[#F2F2F2] py-12 md:py-16">
        <div class="mx-auto max-w-[1170px] px-[15px] text-center">
          <h1 class="text-[28px] md:text-[34px] font-bold text-[#010101]">Account</h1>
          <div class="mt-2 flex items-center justify-center gap-2 text-[13px] font-medium">
            <a href="/index.html" class="text-[#666666] hover:text-[#E55472] transition-colors">Home</a>
            <span class="text-[#999999]">&gt;</span>
            <span class="text-[#010101]">Register</span>
          </div>
        </div>
      </section>

      <section class="mx-auto max-w-[640px] px-4 py-16 md:py-20">
        <div class="text-center mb-10">
          <h2 class="text-[28px] md:text-[32px] font-bold leading-snug text-[#010101]">Register<br />Your Account</h2>
          <p class="mt-3 text-[13px] text-[#666666] max-w-[440px] mx-auto">
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Sit aliquid, Non distinctio vel iste.
          </p>
        </div>

        <form id="register-form" class="space-y-4">
          <input id="reg-first" type="text" required placeholder="First Name" class="h-12 w-full bg-[#F7F7F7] px-4 text-[13px] text-[#010101] placeholder:text-[#888888] focus:bg-white focus:outline-1 focus:outline-[#E55472]" />
          <input id="reg-last" type="text" required placeholder="Last Name" class="h-12 w-full bg-[#F7F7F7] px-4 text-[13px] text-[#010101] placeholder:text-[#888888] focus:bg-white focus:outline-1 focus:outline-[#E55472]" />
          <input id="reg-email" type="email" required placeholder="Email*" class="h-12 w-full bg-[#F7F7F7] px-4 text-[13px] text-[#010101] placeholder:text-[#888888] focus:bg-white focus:outline-1 focus:outline-[#E55472]" />
          <input id="reg-pw" type="password" required placeholder="Password*" class="h-12 w-full bg-[#F7F7F7] px-4 text-[13px] text-[#010101] placeholder:text-[#888888] focus:bg-white focus:outline-1 focus:outline-[#E55472]" />
          <input id="reg-cpw" type="password" required placeholder="Confirm Password*" class="h-12 w-full bg-[#F7F7F7] px-4 text-[13px] text-[#010101] placeholder:text-[#888888] focus:bg-white focus:outline-1 focus:outline-[#E55472]" />

          <label class="flex items-start gap-2.5 pt-2 text-[12px] leading-relaxed text-[#666666] cursor-pointer">
            <input type="checkbox" class="mt-1 accent-[#E55472]" />
            <span>I consent to Fiama processing my personal data in order to send personalized marketing material in accordance with the consent form and the privacy policy.</span>
          </label>
          <label class="flex items-start gap-2.5 text-[12px] leading-relaxed text-[#666666] cursor-pointer">
            <input type="checkbox" required class="mt-1 accent-[#E55472]" />
            <span>By clicking "create account", I consent to the privacy policy.</span>
          </label>

          <p id="reg-error" class="hidden text-[13px] text-[#E55472]"></p>

          <div class="pt-4 text-center">
            <button type="submit" class="bg-[#E55472] px-10 py-3.5 text-[12px] font-semibold uppercase tracking-wider text-white hover:bg-[#d13f5e] transition-colors cursor-pointer">
              CREATE ACCOUNT
            </button>
          </div>
        </form>

        <div class="mt-8 text-center text-[12px] text-[#666666] space-y-3">
          <p>By creating an account, you agree to our:</p>
          <p class="font-semibold text-[#010101] tracking-wider">TERMS OF CONDITIONS &nbsp;&nbsp;|&nbsp;&nbsp; PRIVACY POLICY</p>
          <div class="pt-4">
            <a href="/login.html" class="text-[12px] font-semibold uppercase tracking-wider text-[#010101] hover:text-[#E55472] transition-colors">
              ALREADY HAVE AN ACCOUNT ?
            </a>
          </div>
        </div>
      </section>
    </main>

    <section id="brand-logos"></section>
    <div id="site-footer"></div>
    <div id="site-modals"></div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
